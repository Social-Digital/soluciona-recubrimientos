name: Despliegue Automático a Firebase Hosting

on:
  push:
    branches:
      - main

permissions:
  checks: write
  contents: read
  deployments: write

jobs:
  build_and_deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      # 1. Obtener código fuente del repositorio
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar entorno Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # 3. Instalación limpia de dependencias
      - name: Instalar dependencias
        run: npm ci

      # 4. Compilación del proyecto para producción
      - name: Compilar proyecto
        run: npm run build

      # 5. Despliegue seguro a Firebase Hosting (utilizando Secreto efímero)
      - name: Desplegar a Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOLUCIONA_RECUBRIMIENTOS }}'
          channelId: live
          projectId: soluciona-recubrimientos
